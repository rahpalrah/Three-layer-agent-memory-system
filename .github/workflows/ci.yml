name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        extras: ["dev", "dev,anthropic,fast,onnx,faiss"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and install it (not editable)
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist .
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}[${{ matrix.extras }}]"
      - name: Unit tests (against the installed wheel, not src/)
        run: python -m pytest -q -p no:cacheprovider -o pythonpath= tests
      - name: End-to-end system test
        run: cd /tmp && python $GITHUB_WORKSPACE/tests/e2e/run_e2e.py
